name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Read app version
        id: app_version
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          if [ -z "$version_name" ]; then
            echo "versionName was not found in app/build.gradle" >&2
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Fetch EN translation data
        run: |
          ver="$(curl -sS https://api.github.com/repos/tokanada/ipr-translation-data-en/releases/latest | jq -r .tag_name)"
          curl -L -o /tmp/en.zip "https://github.com/tokanada/ipr-translation-data-en/releases/download/$ver/ipr-translation-data-en-$ver.zip"
          mkdir -p app/src/main/assets/hoshimi-local
          unzip -qo /tmp/en.zip -d app/src/main/assets/hoshimi-local

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          HOSHIMI_RELEASE_KEYSTORE_BASE64: ${{ secrets.HOSHIMI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HOSHIMI_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$HOSHIMI_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          fi

      - name: Build APKs
        env:
          HOSHIMI_RELEASE_STORE_FILE: release.keystore
          HOSHIMI_RELEASE_STORE_PASSWORD: ${{ secrets.HOSHIMI_RELEASE_STORE_PASSWORD }}
          HOSHIMI_RELEASE_KEY_ALIAS: ${{ secrets.HOSHIMI_RELEASE_KEY_ALIAS }}
          HOSHIMI_RELEASE_KEY_PASSWORD: ${{ secrets.HOSHIMI_RELEASE_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease

      - name: Rename APKs
        run: |
          v="${{ steps.app_version.outputs.version_name }}"
          mv app/build/outputs/apk/full/release/app-full-release.apk "HoshimiLocalify-en-full-$v.apk"
          mv app/build/outputs/apk/lite/release/app-lite-release.apk "HoshimiLocalify-en-lite-$v.apk"

      - name: Create or update version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag_name="${{ steps.app_version.outputs.version_name }}"
          git fetch --tags
          git tag -f "$tag_name" "$GITHUB_SHA"
          git push -f origin "$tag_name"

      - name: Upload APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.app_version.outputs.version_name }}"
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --title "$v" --notes ""
          gh release upload "$v" "HoshimiLocalify-en-full-$v.apk" "HoshimiLocalify-en-lite-$v.apk" --clobber
