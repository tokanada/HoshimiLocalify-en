name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - data-release
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: module-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'repository_dispatch' || github.event.action == 'data-release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Read app version
        id: app_version
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          if [ -z "$version_name" ]; then
            echo "versionName was not found in app/build.gradle" >&2
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Fetch EN translation data
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          ver="${PAYLOAD_TAG:-}"
          if [ -z "$ver" ]; then
            for i in 1 2 3 4 5; do
              if ver="$(gh api repos/tokanada/ipr-translation-data-en/releases/latest --jq .tag_name 2>/tmp/latest.err)" \
                 && [ -n "$ver" ] && [ "$ver" != "null" ]; then
                break
              fi
              echo "Attempt $i: could not read latest data release tag: $(cat /tmp/latest.err 2>/dev/null)" >&2
              ver=""
              sleep 10
            done
          fi
          if [ -z "$ver" ] || [ "$ver" = "null" ]; then echo "Could not read latest data release tag" >&2; exit 1; fi
          echo "Using data release $ver"
          curl -fL --retry 3 --retry-delay 5 -o /tmp/en.zip "https://github.com/tokanada/ipr-translation-data-en/releases/download/$ver/ipr-translation-data-en-$ver.zip"
          mkdir -p app/src/main/assets/hoshimi-local
          unzip -qo /tmp/en.zip -d app/src/main/assets/hoshimi-local
          echo "data_tag=$ver" >> "$GITHUB_OUTPUT"
          echo "release_tag=${{ steps.app_version.outputs.version_name }}-data.$ver" >> "$GITHUB_OUTPUT"

      - name: Skip if this module+data release already exists
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.data.outputs.release_tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             && [ "${{ github.event_name }}" != "push" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Release $tag already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant execute permission for Gradle wrapper
        if: steps.gate.outputs.skip != 'true'
        run: chmod +x gradlew

      - name: Restore release keystore
        if: steps.gate.outputs.skip != 'true'
        env:
          HOSHIMI_RELEASE_KEYSTORE_BASE64: ${{ secrets.HOSHIMI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HOSHIMI_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$HOSHIMI_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          fi

      - name: Build APKs
        if: steps.gate.outputs.skip != 'true'
        env:
          HOSHIMI_RELEASE_STORE_FILE: release.keystore
          HOSHIMI_RELEASE_STORE_PASSWORD: ${{ secrets.HOSHIMI_RELEASE_STORE_PASSWORD }}
          HOSHIMI_RELEASE_KEY_ALIAS: ${{ secrets.HOSHIMI_RELEASE_KEY_ALIAS }}
          HOSHIMI_RELEASE_KEY_PASSWORD: ${{ secrets.HOSHIMI_RELEASE_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease

      - name: Rename APKs
        if: steps.gate.outputs.skip != 'true'
        run: |
          t="${{ steps.data.outputs.release_tag }}"
          mv app/build/outputs/apk/full/release/app-full-release.apk "HoshimiLocalify-en-full-$t.apk"
          mv app/build/outputs/apk/lite/release/app-lite-release.apk "HoshimiLocalify-en-lite-$t.apk"

      - name: Publish release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          t="${{ steps.data.outputs.release_tag }}"
          v="${{ steps.app_version.outputs.version_name }}"
          d="${{ steps.data.outputs.data_tag }}"
          notes="Module $v with translation data $d (commit $GITHUB_SHA)."
          files=("HoshimiLocalify-en-full-$t.apk" "HoshimiLocalify-en-lite-$t.apk")
          if gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$t" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$t" --repo "$GITHUB_REPOSITORY" --notes "$notes" --latest
          else
            gh release create "$t" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$t" --notes "$notes" --latest
          fi

      - name: Prune old data releases (keep newest 7)
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | contains("-data."))] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' \
          | while read -r old; do
              case "$old" in
                *-data.*) echo "Deleting old release $old"; gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes ;;
                *) echo "Refusing to delete $old" >&2; exit 1 ;;
              esac
            done
