# One-time migration: copy the release-signing secrets to the new repo.
# Values stay inside GitHub (masked in logs, piped over stdin). Delete after one run.
name: Copy signing secrets (one-time)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repo to copy the secrets to"
        required: true
        default: "Project-Hoshimi/HoshimiLocalify-en"

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy HOSHIMI_RELEASE_* secrets
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_PAT }}
          TARGET: ${{ inputs.target_repo }}
          S_KEYSTORE: ${{ secrets.HOSHIMI_RELEASE_KEYSTORE_BASE64 }}
          S_STORE_PW: ${{ secrets.HOSHIMI_RELEASE_STORE_PASSWORD }}
          S_ALIAS: ${{ secrets.HOSHIMI_RELEASE_KEY_ALIAS }}
          S_KEY_PW: ${{ secrets.HOSHIMI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in GH_TOKEN S_KEYSTORE S_STORE_PW S_ALIAS S_KEY_PW; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
          printf '%s' "$S_KEYSTORE" | gh secret set HOSHIMI_RELEASE_KEYSTORE_BASE64 -R "$TARGET"
          printf '%s' "$S_STORE_PW" | gh secret set HOSHIMI_RELEASE_STORE_PASSWORD -R "$TARGET"
          printf '%s' "$S_ALIAS"    | gh secret set HOSHIMI_RELEASE_KEY_ALIAS -R "$TARGET"
          printf '%s' "$S_KEY_PW"   | gh secret set HOSHIMI_RELEASE_KEY_PASSWORD -R "$TARGET"
          gh secret list -R "$TARGET"
